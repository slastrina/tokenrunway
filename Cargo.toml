[workspace]
resolver = "2"
members = ["src-tauri", "crates/tokenrunway-core"]
default-members = ["src-tauri", "crates/tokenrunway-core"]

[workspace.package]
version = "0.1.0"
authors = ["Tokenrunway contributors"]
license = "MIT"
repository = "https://github.com/slastrina/tokenrunway"
edition = "2021"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
