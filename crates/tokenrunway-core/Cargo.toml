[package]
name = "tokenrunway-core"
description = "Tokenrunway's engine: allowance providers, local harness ingest, pricing, forecasts and update checks"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "macos-system-configuration"] }
url = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "process", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
