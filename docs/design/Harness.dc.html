<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover, Harness tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tr{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Ubuntu,Cantarell,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--r-pop:12px;--r-card:10px;--r-ctl:6px;--blur:blur(32px) saturate(1.7);font-family:var(--font);font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;color:var(--fg1)}
.tr-dark{--bg:#0d1321;--desk:#1b2438;--wall-a:#24324f;--wall-b:#4a3416;--pop:rgba(18,25,40,.80);--card:rgba(255,255,255,.045);--track:rgba(255,255,255,.10);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);--fg1:#eef1f7;--fg2:#aab3c4;--fg3:#8a94a8;--seg-on:rgba(255,255,255,.16);--seg-shadow:none;--btn:rgba(255,255,255,.08);--menubar:rgba(28,33,46,.78);--pressed:rgba(255,255,255,.16);--crit:#ff6b75;--sep:#141b2b;--p-claude:#e5865f;--p-openai:#45c9a0;--p-gemini:#6aa8ff;--h-opencode:#c9b48a;--shadow-pop:0 0 0 .5px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.14),0 18px 48px rgba(0,0,0,.5)}
.tr-light{--bg:#f4f5f8;--desk:#d9dee7;--wall-a:#c3cddd;--wall-b:#f0d6a8;--pop:rgba(248,249,251,.84);--card:#ffffff;--track:rgba(13,19,33,.08);--line:rgba(13,19,33,.09);--line-strong:rgba(13,19,33,.16);--fg1:#0d1321;--fg2:#465064;--fg3:#5d6779;--seg-on:#ffffff;--seg-shadow:0 1px 2px rgba(13,19,33,.14),0 0 0 .5px rgba(13,19,33,.08);--btn:rgba(13,19,33,.06);--menubar:rgba(246,247,250,.78);--pressed:rgba(13,19,33,.12);--crit:#e0384a;--sep:#ffffff;--p-claude:#b8572f;--p-openai:#0b7d5c;--p-gemini:#2f6fd8;--h-opencode:#7a6740;--shadow-pop:0 0 0 .5px rgba(0,0,0,.18),0 18px 48px rgba(13,19,33,.22)}
.tr button{font:inherit;color:inherit}
a{color:inherit}a:hover{color:inherit;text-decoration:underline}
</style>
</helmet>
<div style="width:960px;height:660px;display:flex">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tr tr-{{t.id}}" style="width:480px;height:660px;position:relative;overflow:hidden;background:var(--desk)">
<div style="position:absolute;left:-120px;top:260px;width:460px;height:460px;border-radius:50%;background:var(--wall-a)"></div>
<div style="position:absolute;right:-90px;top:80px;width:280px;height:280px;border-radius:50%;background:var(--wall-b)"></div>

<div style="position:absolute;left:0;right:0;top:0;height:24px;background:var(--menubar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px">
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px;border-radius:5px;background:var(--pressed);color:var(--crit)"><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 2.75h7"></path><path d="M6.6 2.75 2.6 14.25"></path><path d="M9.4 2.75l4 11.5"></path><path d="M8 6v1.3M8 9.4v1.5M8 13v1.25" stroke-width="1.2"></path><circle cx="14.2" cy="3.6" r="3.1" fill="currentColor" stroke="none"></circle></svg><span style="font-size:12.5px;font-weight:600">1h 26m</span></span>
<span style="width:16px;height:12px;border-radius:3px;background:var(--line-strong)"></span>
<span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg2);box-sizing:border-box"></span>
<span style="width:20px;height:10px;border-radius:3px;border:1.5px solid var(--fg2);box-sizing:border-box"></span>
<span style="font-size:13px;font-weight:510">Fri 23 Oct  11:39</span>
</div>

<div role="dialog" aria-label="Tokenrunway" style="position:absolute;top:30px;left:50px;width:380px;height:560px;border-radius:var(--r-pop);background:var(--pop);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden">

<div style="display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px">
<div role="tablist" aria-label="Views" style="display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--btn)">
<button role="tab" aria-selected="false" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:510;color:var(--fg2)">Now</button>
<button role="tab" aria-selected="false" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:510;color:var(--fg2)">Stats</button>
<button role="tab" aria-selected="true" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:var(--seg-on);box-shadow:var(--seg-shadow);font-size:12px;font-weight:600">Harness</button>
</div>
<span style="flex:1"></span>
<span style="font-size:11.5px;color:var(--fg3);padding-right:6px">4 harnesses found</span>
</div>

<div style="flex:1;min-height:0;overflow:hidden;padding:2px 14px 0;display:flex;flex-direction:column;gap:14px">
<div role="radiogroup" aria-label="Period" style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:2px;padding:2px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line)">
<button role="radio" aria-checked="false" style="height:22px;border:0;border-radius:5px;background:transparent;font-size:11.5px;font-weight:510;color:var(--fg2)">Today</button>
<button role="radio" aria-checked="true" style="height:22px;border:0;border-radius:5px;background:var(--seg-on);box-shadow:var(--seg-shadow);font-size:11.5px;font-weight:600">7 d</button>
<button role="radio" aria-checked="false" style="height:22px;border:0;border-radius:5px;background:transparent;font-size:11.5px;font-weight:510;color:var(--fg2)">30 d</button>
<button role="radio" aria-checked="false" style="height:22px;border:0;border-radius:5px;background:transparent;font-size:11.5px;font-weight:510;color:var(--fg2)">Lifetime</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;justify-content:space-between">
<span style="font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)">Share of spend</span>
<span style="font-size:11px;color:var(--fg2)">$412.80 API-equivalent</span>
</div>
<div style="display:flex;height:10px;border-radius:4px;overflow:hidden;gap:2px">
<sc-for list="{{harnesses}}" as="h" hint-placeholder-count="4">
<div style="width:{{h.share}}%;background:var({{h.color}});min-width:3px"></div>
</sc-for>
</div>
</div>

<div style="border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);padding:4px 10px 8px">
<div style="display:grid;grid-template-columns:70px repeat(4, minmax(0, 1fr));column-gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)">
<span></span>
<sc-for list="{{harnesses}}" as="h" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">
<span style="width:16px;height:4px;border-radius:2px;background:var({{h.color}})"></span>
<span style="font-size:11.5px;font-weight:600;line-height:1.15">{{h.name}}</span>
<span style="font-size:10.5px;color:var(--fg3)">{{h.share}}%</span>
</div>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display:grid;grid-template-columns:70px repeat(4, minmax(0, 1fr));column-gap:6px;align-items:center;min-height:25px;border-bottom:1px solid var(--line)">
<span style="font-size:11px;color:var(--fg3)">{{r.label}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
<span style="font-size:{{c.size}}px;font-weight:{{c.w}};color:var({{c.color}});white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.v}}</span>
</sc-for>
</div>
</sc-for>
<div style="display:grid;grid-template-columns:70px repeat(4, minmax(0, 1fr));column-gap:6px;align-items:end;padding-top:8px">
<span style="font-size:11px;color:var(--fg3);align-self:center">Daily shape</span>
<sc-for list="{{harnesses}}" as="h" hint-placeholder-count="4">
<div style="display:flex;align-items:flex-end;gap:2px;height:24px">
<sc-for list="{{h.spark}}" as="s" hint-placeholder-count="7">
<div style="flex:1;height:{{s.h}}px;border-radius:1px;background:var({{h.color}});opacity:{{s.o}}"></div>
</sc-for>
</div>
</sc-for>
</div>
</div>
<p style="margin:0;font-size:11px;color:var(--fg3)">Read locally from each harness's session logs. Bold marks the leader in each row.</p>
</div>

<footer style="height:34px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg3)">
<span>Tokenrunway v0.1.0</span>
<span aria-hidden="true">·</span>
<a href="https://iokig.com" style="color:var(--fg2);text-decoration:none">iokig.com</a>
<span style="flex:1"></span>
<button aria-label="Settings" style="width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M6.9 1.8h2.2l.4 1.7 1.2.6 1.5-.9 1.6 1.6-.9 1.5.6 1.2 1.7.4v2.2l-1.7.4-.6 1.2.9 1.5-1.6 1.6-1.5-.9-1.2.6-.4 1.7H6.9l-.4-1.7-1.2-.6-1.5.9-1.6-1.6.9-1.5-.6-1.2-1.7-.4V6.9l1.7-.4.6-1.2-.9-1.5 1.6-1.6 1.5.9 1.2-.6Z"></path></svg></button>
</footer>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const daily = {
      cc: [8, 5, 56, 70, 74, 64, 41],
      cx: [3, 2, 10, 12, 13, 13, 9],
      oc: [1, 1, 4, 5, 5, 5, 3],
      gm: [0.4, 0.1, 1.3, 1.6, 2.2, 1.9, 0.9]
    };
    const spark = (arr) => {
      const max = Math.max.apply(null, arr);
      return arr.map((v, i) => ({ h: Math.max(2, Math.round((v / max) * 24)), o: i === 6 ? 1 : 0.55 }));
    };
    const harnesses = [
      { name: 'Claude Code', color: '--p-claude', share: 77, spark: spark(daily.cc) },
      { name: 'Codex', color: '--p-openai', share: 15, spark: spark(daily.cx) },
      { name: 'opencode', color: '--h-opencode', share: 6, spark: spark(daily.oc) },
      { name: 'Gemini CLI', color: '--p-gemini', share: 2, spark: spark(daily.gm) }
    ];
    const row = (label, vals, lead, small) => ({
      label,
      cells: vals.map((v, i) => ({
        v,
        w: i === lead ? 600 : 400,
        color: i === lead ? '--fg1' : '--fg2',
        size: small ? 11 : 12
      }))
    });
    return {
      themes: [{ id: 'dark' }, { id: 'light' }],
      harnesses,
      rows: [
        row('Spend', ['$318.40', '$61.90', '$24.10', '$8.40'], 0),
        row('Tokens', ['36.1M', '7.4M', '3.2M', '1.5M'], 0),
        row('Sessions', ['58', '21', '9', '6'], 0),
        row('Avg session', ['34m', '22m', '18m', '11m'], 0),
        row('$ / session', ['$5.49', '$2.95', '$2.68', '$1.40'], 3),
        row('Cache hit', ['71%', '48%', '52%', '33%'], 0),
        row('Top model', ['Opus 5.5', 'GPT-5 Codex', 'Sonnet 5.5', 'Gemini Pro'], -1, true),
        row('Top kind', ['Build', 'Bug fix', 'Refactor', 'Discovery'], -1, true)
      ]
    };
  }
}
</script>
</body>
</html>
