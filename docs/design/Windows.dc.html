<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windows 11 tray flyout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tr{--font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--r-pop-win:8px;--r-card:6px;font-family:var(--font);font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--fg1)}
.tr-dark{--desk:#17203a;--wall-a:#24324f;--wall-b:#4a3416;--taskbar:#1c1f27;--pop:#1b2030;--card:rgba(255,255,255,.05);--track:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);--fg1:#ffffff;--fg2:#c5cad4;--fg3:#9aa1ae;--btn:rgba(255,255,255,.06);--tile-ink:#0d1321;--accent:#f5a524;--accent-ink:#1d1405;--accent-text:#f7b84a;--ok:#7cc4fa;--ok-text:#8ccdfb;--ok-bg:rgba(124,196,250,.13);--warn:#f5a524;--warn-text:#f7b84a;--warn-bg:rgba(245,165,36,.15);--crit:#ff6b75;--crit-text:#ff8f97;--crit-bg:rgba(255,107,117,.15);--p-claude:#e5865f;--p-openai:#45c9a0;--p-bedrock:#b59cff;--shadow-pop:0 0 0 1px rgba(0,0,0,.4),0 32px 64px rgba(0,0,0,.45)}
.tr-light{--desk:#c9d2e0;--wall-a:#aebbd0;--wall-b:#f0d6a8;--taskbar:#eef0f3;--pop:#f3f4f6;--card:#fbfbfc;--track:rgba(0,0,0,.09);--line:rgba(0,0,0,.07);--line-strong:rgba(0,0,0,.13);--fg1:#1b1b1b;--fg2:#4a4f59;--fg3:#5f6571;--btn:rgba(0,0,0,.04);--tile-ink:#ffffff;--accent:#f5a524;--accent-ink:#1d1405;--accent-text:#94570a;--ok:#3b82d6;--ok-text:#1f62b0;--ok-bg:rgba(59,130,214,.11);--warn:#f0a020;--warn-text:#94570a;--warn-bg:rgba(245,165,36,.17);--crit:#e0384a;--crit-text:#bd2536;--crit-bg:rgba(224,56,74,.10);--p-claude:#b8572f;--p-openai:#0b7d5c;--p-bedrock:#6d4fd6;--shadow-pop:0 0 0 1px rgba(0,0,0,.08),0 32px 64px rgba(0,0,0,.22)}
.tr button{font:inherit;color:inherit}
a{color:inherit}a:hover{color:inherit;text-decoration:underline}
</style>
</helmet>
<div style="width:960px;height:700px;display:flex">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tr tr-{{t.id}}" style="width:480px;height:700px;position:relative;overflow:hidden;background:var(--desk)">
<div style="position:absolute;left:-140px;top:120px;width:440px;height:440px;border-radius:50%;background:var(--wall-a)"></div>
<div style="position:absolute;right:-120px;top:-60px;width:300px;height:300px;border-radius:50%;background:var(--wall-b)"></div>

<div role="dialog" aria-label="Tokenrunway" style="position:absolute;right:12px;bottom:60px;width:380px;height:560px;border-radius:var(--r-pop-win);background:var(--pop);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden">
<div style="display:flex;align-items:center;gap:4px;padding:8px 8px 0 10px;border-bottom:1px solid var(--line)">
<div role="tablist" aria-label="Views" style="display:flex;gap:2px">
<button role="tab" aria-selected="true" style="position:relative;height:36px;padding:0 12px;border:0;border-radius:4px;background:transparent;font-size:13px;font-weight:600">Now<span style="position:absolute;left:50%;bottom:0;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--accent)"></span></button>
<button role="tab" aria-selected="false" style="height:36px;padding:0 12px;border:0;border-radius:4px;background:transparent;font-size:13px;color:var(--fg2)">Stats</button>
<button role="tab" aria-selected="false" style="height:36px;padding:0 12px;border:0;border-radius:4px;background:transparent;font-size:13px;color:var(--fg2)">Harness</button>
</div>
<span style="flex:1"></span>
<button aria-label="Refresh all" style="width:32px;height:32px;border:0;border-radius:4px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"></path><path d="M13.5 2.5v3h-3"></path></svg></button>
</div>

<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px 12px">
<div style="display:flex;flex-direction:column;gap:1px">
<span style="font-size:12px;color:var(--fg3)">Shortest runway</span>
<span style="font-size:28px;font-weight:600;line-height:1.1;color:var(--crit-text)">1h 26m</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-bottom:3px">
<span style="font-size:12px;font-weight:600">Claude — work · 5-hour</span>
<span style="font-size:12px;color:var(--fg2)">1 critical · 1 tight · 4 on track</span>
</div>
</div>

<div style="flex:1;min-height:0;overflow:hidden;padding:0 10px;display:flex;flex-direction:column;gap:6px">
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
<article style="flex-shrink:0;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);padding:12px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:9px">
<span style="width:24px;height:24px;flex-shrink:0;border-radius:4px;background:var({{a.color}});color:var(--tile-ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">{{a.mono}}</span>
<div style="display:flex;flex-direction:column;min-width:0;flex:1;gap:1px">
<div style="display:flex;align-items:center;gap:6px"><span style="font-size:13px;font-weight:600">{{a.name}}</span><span style="height:18px;padding:0 6px;border-radius:4px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--line-strong);font-size:11px;color:var(--fg2);display:inline-flex;align-items:center">{{a.plan}}</span></div>
<span style="font-size:11.5px;color:var(--fg3)">Updated {{a.updated}}</span>
</div>
<button aria-label="More actions" style="width:28px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1"></circle><circle cx="8" cy="8" r="1.1"></circle><circle cx="12.5" cy="8" r="1.1"></circle></svg></button>
</div>
<sc-for list="{{a.windows}}" as="w" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:5px">
<div style="display:flex;align-items:baseline;gap:6px">
<span style="font-size:12.5px;font-weight:600">{{w.label}}</span>
<span style="font-size:12px;color:var(--fg3)">{{w.abs}}</span>
<span style="margin-left:auto;font-size:13px;font-weight:600;color:var({{w.text}})">{{w.pct}}%</span>
</div>
<div style="height:4px;border-radius:2px;background:var(--track);position:relative;overflow:hidden">
<div style="position:absolute;left:0;top:0;bottom:0;width:{{w.pct}}%;background:var({{w.fill}});border-radius:2px"></div>
<div style="position:absolute;left:{{w.pct}}%;top:0;bottom:0;width:{{w.projW}}%;background:repeating-linear-gradient(-45deg,var({{w.fill}}) 0 2px,transparent 2px 5px);opacity:.55"></div>
<div style="position:absolute;left:{{w.pace}}%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg1);opacity:.8"></div>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:20px">
<span style="font-size:12px;color:var(--fg2)">{{w.reset}}</span>
<sc-if value="{{w.isChip}}" hint-placeholder-val="{{ true }}">
<span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;background:var({{w.chipBg}});color:var({{w.text}});font-size:11.5px;font-weight:600;white-space:nowrap">{{w.fc}}</span>
</sc-if>
</div>
<sc-if value="{{w.isCrit}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;padding:6px 6px 6px 9px;border-radius:4px;background:var(--crit-bg);color:var(--crit-text)">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 1.8h5l3.7 3.7v5l-3.7 3.7h-5l-3.7-3.7v-5Z"></path><path d="M8 5v3.6"></path><path d="M8 11v.01"></path></svg>
<span style="font-size:12px;font-weight:600;flex:1">{{w.fc}}</span>
<button style="height:28px;padding:0 12px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600">Request more</button>
</div>
</sc-if>
</div>
</sc-for>
</article>
</sc-for>
</div>

<footer style="height:40px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;border-top:1px solid var(--line);background:var(--btn);font-size:12px;color:var(--fg3)">
<span>Tokenrunway v0.1.0</span>
<span aria-hidden="true">·</span>
<a href="https://iokig.com" style="color:var(--fg2);text-decoration:none">iokig.com</a>
<span style="flex:1"></span>
<button aria-label="Settings" style="width:32px;height:32px;border:0;border-radius:4px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M6.9 1.8h2.2l.4 1.7 1.2.6 1.5-.9 1.6 1.6-.9 1.5.6 1.2 1.7.4v2.2l-1.7.4-.6 1.2.9 1.5-1.6 1.6-1.5-.9-1.2.6-.4 1.7H6.9l-.4-1.7-1.2-.6-1.5.9-1.6-1.6.9-1.5-.6-1.2-1.7-.4V6.9l1.7-.4.6-1.2-.9-1.5 1.6-1.6 1.5.9 1.2-.6Z"></path></svg></button>
</footer>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--taskbar);box-shadow:0 -1px 0 var(--line);display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 10px">
<span style="width:28px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg1)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5"></path></svg></span>
<span style="width:30px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--line)"><svg width="16" height="16" viewBox="0 0 18 16" fill="none" stroke="var(--crit)" stroke-width="1.5" stroke-linecap="round" role="img" aria-label="Tokenrunway, critical"><path d="M3.5 2.75h7"></path><path d="M6.6 2.75 2.6 14.25"></path><path d="M9.4 2.75l4 11.5"></path><path d="M8 6v1.3M8 9.4v1.5M8 13v1.25" stroke-width="1.2"></path><circle cx="14.2" cy="3.6" r="3.1" fill="var(--crit)" stroke="none"></circle></svg></span>
<span style="width:16px;height:12px;border-radius:2px;background:var(--line-strong);margin:0 7px"></span>
<span style="width:16px;height:12px;border-radius:2px;background:var(--line-strong);margin:0 7px"></span>
<span style="display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.3;padding:0 6px;color:var(--fg1)"><span>11:39</span><span>23/10/2026</span></span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":700}}'>
class Component extends DCLogic {
  win(label, abs, pct, reset, pace, proj, status, fc) {
    const map = {
      ok: { fill: '--ok', text: '--ok-text', chipBg: '--ok-bg' },
      warn: { fill: '--warn', text: '--warn-text', chipBg: '--warn-bg' },
      crit: { fill: '--crit', text: '--crit-text', chipBg: '--crit-bg' },
      est: { fill: '--fg3', text: '--fg2', chipBg: '--btn' }
    }[status];
    return { label, abs, pct, reset, pace, fc, projW: Math.max(0, Math.min(100, proj) - pct), fill: map.fill, text: map.text, chipBg: map.chipBg, isChip: status !== 'crit', isCrit: status === 'crit' };
  }
  renderVals() {
    const w = this.win.bind(this);
    return {
      themes: [{ id: 'light' }, { id: 'dark' }],
      accounts: [
        { name: 'Claude — work', plan: 'Enterprise', mono: 'C', color: '--p-claude', updated: '12 s ago', windows: [
          w('5-hour', '412k / 530k tokens', 78, 'resets in 2h 41m · 14:20', 46, 130, 'crit', 'Out at 13:05, 1h 15m before reset'),
          w('Weekly', '', 64, 'resets in 2d 21h · Mon 09:00', 59, 79, 'ok', 'On track'),
          w('Weekly Opus', '', 83, 'resets in 2d 21h · Mon 09:00', 59, 97, 'warn', 'Tight · ~97% at reset')
        ] },
        { name: 'ChatGPT — personal', plan: 'Pro', mono: 'O', color: '--p-openai', updated: '48 s ago', windows: [
          w('Codex 5-hour', '', 12, 'resets in 3h 52m · 15:31', 23, 52, 'ok', 'On track'),
          w('Codex weekly', '', 31, 'resets in 4d 6h · Tue 17:50', 39, 79, 'ok', 'On track')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
