<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popover, Now tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tr{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Ubuntu,Cantarell,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--r-pop:12px;--r-card:10px;--r-ctl:6px;--blur:blur(32px) saturate(1.7);font-family:var(--font);font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;color:var(--fg1)}
.tr-dark{--bg:#0d1321;--desk:#1b2438;--wall-a:#24324f;--wall-b:#4a3416;--pop:rgba(18,25,40,.80);--pop-solid:#141b2b;--card:rgba(255,255,255,.045);--track:rgba(255,255,255,.10);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);--fg1:#eef1f7;--fg2:#aab3c4;--fg3:#8a94a8;--seg-on:rgba(255,255,255,.16);--seg-shadow:none;--btn:rgba(255,255,255,.08);--tile-ink:#0d1321;--menubar:rgba(28,33,46,.78);--pressed:rgba(255,255,255,.16);--accent:#f5a524;--accent-ink:#1d1405;--accent-text:#f7b84a;--ok:#7cc4fa;--ok-text:#8ccdfb;--ok-bg:rgba(124,196,250,.13);--warn:#f5a524;--warn-text:#f7b84a;--warn-bg:rgba(245,165,36,.15);--crit:#ff6b75;--crit-text:#ff8f97;--crit-bg:rgba(255,107,117,.15);--p-claude:#e5865f;--p-openai:#45c9a0;--p-bedrock:#b59cff;--shadow-pop:0 0 0 .5px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.14),0 18px 48px rgba(0,0,0,.5)}
.tr-light{--bg:#f4f5f8;--desk:#d9dee7;--wall-a:#c3cddd;--wall-b:#f0d6a8;--pop:rgba(248,249,251,.84);--pop-solid:#f7f8fa;--card:#ffffff;--track:rgba(13,19,33,.08);--line:rgba(13,19,33,.09);--line-strong:rgba(13,19,33,.16);--fg1:#0d1321;--fg2:#465064;--fg3:#5d6779;--seg-on:#ffffff;--seg-shadow:0 1px 2px rgba(13,19,33,.14),0 0 0 .5px rgba(13,19,33,.08);--btn:rgba(13,19,33,.06);--tile-ink:#ffffff;--menubar:rgba(246,247,250,.78);--pressed:rgba(13,19,33,.12);--accent:#f5a524;--accent-ink:#1d1405;--accent-text:#94570a;--ok:#3b82d6;--ok-text:#1f62b0;--ok-bg:rgba(59,130,214,.11);--warn:#f0a020;--warn-text:#94570a;--warn-bg:rgba(245,165,36,.17);--crit:#e0384a;--crit-text:#bd2536;--crit-bg:rgba(224,56,74,.10);--p-claude:#b8572f;--p-openai:#0b7d5c;--p-bedrock:#6d4fd6;--shadow-pop:0 0 0 .5px rgba(0,0,0,.18),0 18px 48px rgba(13,19,33,.22)}
.tr button{font:inherit;color:inherit}
a{color:inherit}a:hover{color:inherit;text-decoration:underline}
</style>
</helmet>
<div style="width:960px;height:660px;display:flex">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tr tr-{{t.id}}" style="width:480px;height:660px;position:relative;overflow:hidden;background:var(--desk)">
<div style="position:absolute;left:-120px;top:260px;width:460px;height:460px;border-radius:50%;background:var(--wall-a)"></div>
<div style="position:absolute;right:-90px;top:80px;width:280px;height:280px;border-radius:50%;background:var(--wall-b)"></div>

<div style="position:absolute;left:0;right:0;top:0;height:24px;background:var(--menubar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px">
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px;border-radius:5px;background:var(--pressed);color:var(--crit)"><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 2.75h7"></path><path d="M6.6 2.75 2.6 14.25"></path><path d="M9.4 2.75l4 11.5"></path><path d="M8 6v1.3M8 9.4v1.5M8 13v1.25" stroke-width="1.2"></path><circle cx="14.2" cy="3.6" r="3.1" fill="currentColor" stroke="none"></circle></svg><span style="font-size:12.5px;font-weight:600">1h 26m</span></span>
<span style="width:16px;height:12px;border-radius:3px;background:var(--line-strong)"></span>
<span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg2);box-sizing:border-box"></span>
<span style="width:20px;height:10px;border-radius:3px;border:1.5px solid var(--fg2);box-sizing:border-box"></span>
<span style="font-size:13px;font-weight:510">Fri 23 Oct  11:39</span>
</div>

<div role="dialog" aria-label="Tokenrunway" style="position:absolute;top:30px;left:50px;width:380px;height:560px;border-radius:var(--r-pop);background:var(--pop);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden">

<div style="display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px">
<div role="tablist" aria-label="Views" style="display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--btn)">
<button role="tab" aria-selected="true" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:var(--seg-on);box-shadow:var(--seg-shadow);font-size:12px;font-weight:600">Now</button>
<button role="tab" aria-selected="false" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:510;color:var(--fg2)">Stats</button>
<button role="tab" aria-selected="false" style="height:24px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:12px;font-weight:510;color:var(--fg2)">Harness</button>
</div>
<span style="flex:1"></span>
<button aria-label="Add account" style="width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
<button aria-label="Refresh all" style="width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"></path><path d="M13.5 2.5v3h-3"></path></svg></button>
</div>

<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:4px 16px 12px">
<div style="display:flex;flex-direction:column;gap:1px">
<span style="font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)">Shortest runway</span>
<span style="font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--crit-text)">1h 26m</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-bottom:3px">
<span style="font-size:12px;font-weight:510">Claude — work · 5-hour</span>
<span style="font-size:11.5px;color:var(--fg2)">1 critical · 1 tight · 4 on track</span>
</div>
</div>

<div style="flex:1;min-height:0;overflow:hidden;padding:0 10px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
<article style="flex-shrink:0;border-radius:var(--r-card);background:var(--card);box-shadow:0 0 0 1px var(--line);padding:12px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:9px">
<span style="width:26px;height:26px;flex-shrink:0;border-radius:7px;background:var({{a.color}});color:var(--tile-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">{{a.mono}}</span>
<div style="display:flex;flex-direction:column;min-width:0;flex:1;gap:1px">
<div style="display:flex;align-items:center;gap:6px">
<span style="font-size:13px;font-weight:600;white-space:nowrap">{{a.name}}</span>
<span style="height:17px;padding:0 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:10.5px;font-weight:510;color:var(--fg2);display:inline-flex;align-items:center">{{a.plan}}</span>
</div>
<span style="font-size:11px;color:var(--fg3)">Updated {{a.updated}}</span>
</div>
<button aria-label="Open provider page" style="width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--fg3);display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7"></path><path d="M13.5 2.5 7.5 8.5"></path><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"></path></svg></button>
<button aria-label="Refresh" style="width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--fg3);display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"></path><path d="M13.5 2.5v3h-3"></path></svg></button>
</div>

<sc-for list="{{a.windows}}" as="w" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:5px">
<div style="display:flex;align-items:baseline;gap:6px">
<span style="font-size:12.5px;font-weight:600">{{w.label}}</span>
<span style="font-size:11.5px;color:var(--fg3)">{{w.abs}}</span>
<span style="margin-left:auto;font-size:13px;font-weight:600;color:var({{w.text}})">{{w.pct}}%</span>
</div>
<div style="height:6px;border-radius:3px;background:var(--track);position:relative;overflow:hidden">
<div style="position:absolute;left:0;top:0;bottom:0;width:{{w.pct}}%;background:var({{w.fill}});border-radius:3px"></div>
<div style="position:absolute;left:{{w.pct}}%;top:0;bottom:0;width:{{w.projW}}%;background:repeating-linear-gradient(-45deg,var({{w.fill}}) 0 2px,transparent 2px 5px);opacity:.55"></div>
<div style="position:absolute;left:{{w.pace}}%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg1);opacity:.8"></div>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:20px">
<span style="font-size:11.5px;color:var(--fg2)">{{w.reset}}</span>
<sc-if value="{{w.isChip}}" hint-placeholder-val="{{ true }}">
<span style="margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;background:var({{w.chipBg}});color:var({{w.text}});font-size:11px;font-weight:510;white-space:nowrap">
<sc-if value="{{w.isOk}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="m5.4 8.2 1.8 1.8 3.4-3.7"></path></svg></sc-if>
<sc-if value="{{w.isWarn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2 14.2 13.2H1.8Z"></path><path d="M8 6.6v3"></path><path d="M8 11.4v.01"></path></svg></sc-if>
<sc-if value="{{w.isEst}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-dasharray="2.2 2"></circle><path d="M5.2 8.6c.9-1.2 1.8-1.2 2.8 0s1.9 1.2 2.8 0"></path></svg></sc-if>
{{w.fc}}</span>
</sc-if>
</div>
<sc-if value="{{w.isCrit}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;padding:6px 6px 6px 9px;border-radius:7px;background:var(--crit-bg);color:var(--crit-text)">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 1.8h5l3.7 3.7v5l-3.7 3.7h-5l-3.7-3.7v-5Z"></path><path d="M8 5v3.6"></path><path d="M8 11v.01"></path></svg>
<span style="font-size:12px;font-weight:600;flex:1">{{w.fc}}</span>
<button style="height:24px;padding:0 10px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600">Request more</button>
</div>
</sc-if>
</div>
</sc-for>
</article>
</sc-for>
</div>

<footer style="height:34px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg3)">
<span>Tokenrunway v0.1.0</span>
<span aria-hidden="true">·</span>
<a href="https://iokig.com" style="color:var(--fg2);text-decoration:none">iokig.com</a>
<span style="flex:1"></span>
<button aria-label="Settings" style="width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M6.9 1.8h2.2l.4 1.7 1.2.6 1.5-.9 1.6 1.6-.9 1.5.6 1.2 1.7.4v2.2l-1.7.4-.6 1.2.9 1.5-1.6 1.6-1.5-.9-1.2.6-.4 1.7H6.9l-.4-1.7-1.2-.6-1.5.9-1.6-1.6.9-1.5-.6-1.2-1.7-.4V6.9l1.7-.4.6-1.2-.9-1.5 1.6-1.6 1.5.9 1.2-.6Z"></path></svg></button>
</footer>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":660}}'>
class Component extends DCLogic {
  win(label, abs, pct, reset, pace, proj, status, fc) {
    const map = {
      ok: { fill: '--ok', text: '--ok-text', chipBg: '--ok-bg' },
      warn: { fill: '--warn', text: '--warn-text', chipBg: '--warn-bg' },
      crit: { fill: '--crit', text: '--crit-text', chipBg: '--crit-bg' },
      est: { fill: '--fg3', text: '--fg2', chipBg: '--btn' }
    }[status];
    return {
      label, abs, pct, reset, pace, fc,
      projW: Math.max(0, Math.min(100, proj) - pct),
      fill: map.fill, text: map.text, chipBg: map.chipBg,
      isChip: status !== 'crit', isCrit: status === 'crit',
      isOk: status === 'ok', isWarn: status === 'warn', isEst: status === 'est'
    };
  }
  renderVals() {
    const w = this.win.bind(this);
    return {
      themes: [{ id: 'dark' }, { id: 'light' }],
      accounts: [
        { name: 'Claude — work', plan: 'Enterprise', mono: 'C', color: '--p-claude', updated: '12 s ago', windows: [
          w('5-hour', '412k / 530k tokens', 78, 'resets in 2h 41m · 14:20', 46, 130, 'crit', 'Out at 13:05, 1h 15m before reset'),
          w('Weekly', '', 64, 'resets in 2d 21h · Mon 09:00', 59, 79, 'ok', 'On track'),
          w('Weekly Opus', '', 83, 'resets in 2d 21h · Mon 09:00', 59, 97, 'warn', 'Tight · ~97% at reset')
        ] },
        { name: 'ChatGPT — personal', plan: 'Pro', mono: 'O', color: '--p-openai', updated: '48 s ago', windows: [
          w('Codex 5-hour', '', 12, 'resets in 3h 52m · 15:31', 23, 52, 'ok', 'On track'),
          w('Codex weekly', '', 31, 'resets in 4d 6h · Tue 17:50', 39, 79, 'ok', 'On track')
        ] },
        { name: 'AWS Bedrock — iokig-prod', plan: 'On-demand', mono: 'B', color: '--p-bedrock', updated: '4 min ago', windows: [
          w('Monthly budget', '$184 / $500', 37, 'resets in 8d 12h · 1 Nov', 72, 51, 'est', 'Rough estimate · ~$255')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
