name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub Release.
# Run it by hand from the Actions tab to get the installers as build artifacts only.
#
# macOS builds are signed with a Developer ID and notarized when these repository
# secrets are set (same names as the other slastrina apps); without them the app is
# only ad-hoc signed:
#   DEVELOPER_ID_CERT_P12 (base64 .p12 holding only the Developer ID Application identity),
#   DEVELOPER_ID_CERT_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)"),
#   APPLE_ID, APPLE_APP_PASSWORD (app-specific password),
#   APPLE_ORG_NAME (not used by Tauri; referenced only so the log masks it).
#
# In-place updates (Settings → Check for updates): every bundle is signed with the updater key,
#   TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, whose public half is
#   plugins.updater.pubkey in src-tauri/tauri.conf.json. The "Updater manifest" job then
#   publishes latest.json, which the app reads from the latest release. A tag without the key
#   fails rather than publish a release that installed copies can't update to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release's notes are the tag's section of CHANGELOG.md ("## [0.1.0] - 2026-10-23" up to the
  # next "## "). The app shows the part above "Download the installer…" as What's new.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        env:
          REF: ${{ github.ref_name }}
        run: |
          v="${REF#v}"
          notes=$(awk -v v="$v" '/^## /{ if (on) exit; if (index($0, "[" v "]")) { on=1; next } } on' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$notes" ] && [ "${{ github.ref_type }}" = tag ]; then
            echo "::error::CHANGELOG.md has no section for $v"; exit 1
          fi
          { echo 'body<<__TR_EOF__'; echo "## What's new"; echo; echo "$notes"; echo '__TR_EOF__'; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ''
            rust-targets: ''
          # 22.04 for the oldest glibc the .deb and AppImage still run on.
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ''
          # arm64 Linux, built natively on GitHub's arm64 runner. Bundles are named _arm64.deb and _aarch64.AppImage, so
          # they sit beside the x86_64 ones in the release without colliding.
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,appimage
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf

      # Tauri treats an empty APPLE_* variable as "sign with this", so only export the
      # ones whose secrets are actually set.
      - name: Signing setup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # Not secret: the team ID is embedded in every app it signs.
          APPLE_TEAM_ID: LN23P43535
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Developer ID secrets not set; the macOS build will be ad-hoc signed and not notarized."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && { echo "$v<<__TR_EOF__"; echo "${!v}"; echo "__TR_EOF__"; } >> "$GITHUB_ENV"
          done
          echo "Signing with the Developer ID identity."

      - name: Updater key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pub=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if [ -z "$KEY" ] || [ -z "$pub" ]; then
            echo "::error::The updater key isn't set up (TAURI_SIGNING_PRIVATE_KEY secret, plugins.updater.pubkey in tauri.conf.json)."
            exit 1
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ORG_NAME: ${{ secrets.APPLE_ORG_NAME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # latest.json comes from the "Updater manifest" job, once every build is in, rather
          # than from four builds updating one file at once.
          includeUpdaterJson: false
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Tokenrunway ${{ github.ref_name }}
          releaseBody: |
            ${{ needs.notes.outputs.body }}

            Download the installer for your platform below.

            **macOS 11+ (Apple Silicon and Intel):** open the `.dmg` and drag Tokenrunway to Applications. Or install with Homebrew: `brew install --cask slastrina/tap/tokenrunway`
            **Windows:** run the `-setup.exe` (or the `.msi`). If SmartScreen warns you, choose **More info → Run anyway**.
            **Linux (x86_64):** install the `_amd64.deb` (Debian, Ubuntu 22.04+) or run the `_amd64.AppImage` (`chmod +x` first). The tray needs libayatana-appindicator (and on GNOME the AppIndicator extension); logins need a Secret Service keyring such as GNOME Keyring or KWallet.
            **Linux (arm64):** the `_arm64.deb` or the `_aarch64.AppImage`.
          releaseDraft: false
          prerelease: false

      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tokenrunway-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # latest.json for the in-app updater (see updates.rs): each platform's bundle and signature
  # from this release, and its notes. Every platform must be there, or the job fails.
  updater:
    name: Updater manifest
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body,publishedAt > release.json
          python3 - <<'PY'
          import json, os, sys
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          v = tag.lstrip("v")
          files = {
              "darwin-aarch64": "Tokenrunway_universal.app.tar.gz",
              "darwin-x86_64": "Tokenrunway_universal.app.tar.gz",
              "windows-x86_64": f"Tokenrunway_{v}_x64-setup.exe",
              "windows-x86_64-nsis": f"Tokenrunway_{v}_x64-setup.exe",
              "windows-x86_64-msi": f"Tokenrunway_{v}_x64_en-US.msi",
              "linux-x86_64": f"Tokenrunway_{v}_amd64.AppImage",
              "linux-aarch64": f"Tokenrunway_{v}_aarch64.AppImage",
          }
          platforms, missing = {}, []
          for key, name in files.items():
              sig = os.path.join("sigs", name + ".sig")
              if not os.path.exists(sig):
                  missing.append(name + ".sig")
                  continue
              platforms[key] = {"signature": open(sig).read().strip(), "url": f"https://github.com/{repo}/releases/download/{tag}/{name}"}
          if missing:
              sys.exit("Missing signatures: " + ", ".join(sorted(set(missing))))
          rel = json.load(open("release.json"))
          notes = rel["body"].split("Download the installer for your platform below.")[0].strip()
          json.dump({"version": v, "notes": notes, "pub_date": rel["publishedAt"], "platforms": platforms}, open("latest.json", "w"), indent=2)
          print(json.dumps(sorted(platforms)))
          PY
          gh release upload "$TAG" latest.json -R "$GITHUB_REPOSITORY" --clobber

  # Bumps the cask in slastrina/homebrew-tap once the release has its DMG.
  # Needs a HOMEBREW_TAP_PAT secret with write access to that repo; skipped without it.
  homebrew:
    name: Update Homebrew tap
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cask
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "::warning::HOMEBREW_TAP_PAT not set; skipping the tap update."; exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Tokenrunway_${VERSION}_universal.dmg"
          gh release download "$TAG" --pattern "$DMG" --dir "$RUNNER_TEMP"
          SHA=$(sha256sum "$RUNNER_TEMP/$DMG" | awk '{print $1}')
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/slastrina/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA}/" packaging/homebrew/tokenrunway.rb.template > "$TAP_DIR/Casks/tokenrunway.rb"
          cd "$TAP_DIR"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/tokenrunway.rb
          git commit -m "tokenrunway ${VERSION}" || { echo "cask unchanged"; exit 0; }
          git push origin HEAD
