[package]
name = "tokenrunway"
description = "See every AI subscription's allowance, resets and spend from your menubar"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tokenrunway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokenrunway-core = { path = "../crates/tokenrunway-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# In-place updates, when the user asks (see updates.rs)
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
# Re-reads harness logs when they change (SPEC.md §5.2)
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
